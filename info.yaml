# Tiny Tapeout project information
project:
  title:        "Dual-Channel PWM with SPI Control"
  author:       "Nicolás Romero, Eduardo Holguín"
  discord:      "" 
  description:  "Two complementary PWM outputs per channel with SPI-configurable duty and edge/center alignment."
  language:     "Verilog"
  clock_hz:     1000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_top_general"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_top_general.v"
    - "top_general.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CLK_g"
  ui[1]: "SCLK_g"
  ui[2]: "MOSI_g"
  ui[3]: "SS_g (active-low)"
  ui[4]: "RESET_g (active-high)"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "PWM1"
  uo[1]: "PWM1_N"
  uo[2]: "PWM2"
  uo[3]: "PWM2_N"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
